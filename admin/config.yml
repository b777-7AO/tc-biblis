          - label: "Trainer"
            name: items
            label_singular: "Person"
            widget: list
            summary: "{{fields.name}} – {{fields.role}}"
            fields:
              - { label: "Initialen (max. 3 Zeichen, z. B. SS)", name: initials, widget: string }
              - { label: "Rolle (z. B. Trainerin)", name: role, widget: string, default: "Trainer" }
              - { label: "Name", name: name, widget: string }
              - { label: "E-Mail (optional)", name: email, widget: string, required: false }
              - { label: "Telefon (optional)", name: phone, widget: string, required: false }

