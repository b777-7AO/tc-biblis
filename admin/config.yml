# ───────────────────────────────────────────────────────────────
# TC Biblis – CMS configuration (Sveltia / Decap compatible)
# Editors manage content here; saving commits to GitHub and the
# site updates automatically. See ../CMS-SETUP.md for first-time setup.
# ───────────────────────────────────────────────────────────────

backend:
  name: github
  repo: julianito03/tc-biblis        # <-- your GitHub repo (owner/name)
  branch: main
  # No base_url needed: editors log in with a GitHub Access Token (see CMS-SETUP.md).
  # (Optional, for a one-click "Sign in with GitHub" instead of a token, deploy the
  #  sveltia-cms-auth worker and set base_url to its URL — see the guide.)

site_url: https://julianito03.github.io/tc-biblis/
display_url: https://julianito03.github.io/tc-biblis/
locale: de

# Where uploaded images are stored / linked from (relative path works on every page)
media_folder: "assets/img"
public_folder: "assets/img"

collections:
  # ── Site images (used across the whole website) ───────────────
  - name: images
    label: "Bilder"
    icon: image
    files:
      - name: images
        label: "Website-Bilder"
        file: "content/images.json"
        description: "Hauptfotos der Website. Neues Bild hochladen → Save. Wird überall verwendet, wo das Bild erscheint."
        fields:
          - { label: "Hero / Startseite (großes Titelbild)", name: hero, widget: image }
          - { label: "Sandplätze / Anlage", name: courts, widget: image }
          - { label: "Tennishalle (innen)", name: hall, widget: image }
          - { label: "Jugend / Kindertraining", name: junior, widget: image }
          - { label: "Training / Coaching", name: coaching, widget: image }
          - { label: "Mannschaften / Match", name: match, widget: image }
          - { label: "Clubhaus / Geselligkeit", name: clubhouse, widget: image }
          - { label: "Gemeinschaft / Mitglieder", name: community, widget: image }

  # ── Page texts (headings & intros) ────────────────────────────
  - name: texts
    label: "Seitentexte"
    icon: edit_note
    files:
      - name: texts
        label: "Texte"
        file: "content/texts.json"
        description: "Überschriften und Einleitungstexte. HTML wie <br> (Zeilenumbruch) ist im Titel erlaubt."
        fields:
          - label: "Startseite"
            name: home
            widget: object
            collapsed: true
            fields:
              - { label: "Hero – kleiner Text oben", name: hero_eyebrow, widget: string }
              - { label: "Hero – Überschrift (mit <br> möglich)", name: hero_title, widget: string }
              - { label: "Hero – Beschreibung", name: hero_text, widget: text }
              - { label: "Hero – Button 1", name: hero_cta1, widget: string }
              - { label: "Hero – Button 2", name: hero_cta2, widget: string }
              - { label: "Intro – kleiner Text", name: intro_eyebrow, widget: string }
              - { label: "Intro – Überschrift", name: intro_title, widget: string }
              - { label: "Intro – Text", name: intro_text, widget: text }
              - { label: "Abschnitt 1 – kleiner Text", name: split1_eyebrow, widget: string }
              - { label: "Abschnitt 1 – Überschrift", name: split1_title, widget: string }
              - { label: "Abschnitt 1 – Text", name: split1_text, widget: text }
              - { label: "Abschnitt 2 – kleiner Text", name: split2_eyebrow, widget: string }
              - { label: "Abschnitt 2 – Überschrift", name: split2_title, widget: string }
              - { label: "Abschnitt 2 – Text", name: split2_text, widget: text }
              - { label: "News – Überschrift", name: news_title, widget: string }
              - { label: "Schluss-Aufruf – Überschrift", name: cta_title, widget: string }
              - { label: "Schluss-Aufruf – Text", name: cta_text, widget: text }
          - label: "Anlage"
            name: anlage
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Tennishalle"
            name: tennishalle
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Training & Trainingszeiten"
            name: trainingszeiten
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Trainerteam"
            name: trainerteam
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Jugend"
            name: jugend
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Mannschaften"
            name: mannschaften
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Vorstand"
            name: vorstand
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Historie"
            name: historie
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Werbepartner"
            name: werbepartner
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
          - label: "Mitgliedschaft"
            name: mitgliedschaft
            widget: object
            collapsed: true
            fields:
              - { label: "Titel", name: hero_title, widget: string }
              - { label: "Untertitel", name: hero_subtitle, widget: text }
  # ── News on the homepage ──────────────────────────────────────
  - name: news
    label: "Aktuelles (Startseite)"
    icon: campaign
    files:
      - name: news
        label: "Neuigkeiten"
        file: "content/news.json"
        description: "Die Meldungen im Bereich „Neuigkeiten aus dem Verein“."
        fields:
          - label: "Meldungen"
            name: items
            label_singular: "Meldung"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Tag (z. B. 08)", name: day, widget: string }
              - { label: "Monat / Jahr (z. B. März 26)", name: month, widget: string }
              - { label: "Titel", name: title, widget: string }
              - { label: "Text", name: text, widget: text }

  # ── Trainer team ──────────────────────────────────────────────
  - name: trainers
    label: "Trainerteam"
    icon: sports_tennis
    files:
      - name: trainers
        label: "Trainerinnen & Trainer"
        file: "content/trainers.json"
        description: "Die Personen auf der Seite „Trainerteam“ (die LVT-Kachel bleibt automatisch erhalten)."
        fields:
          - label: "Trainer"
            name: items
            label_singular: "Person"
            widget: list
            summary: "{{fields.name}} – {{fields.role}}"
            fields:
              - { label: "Initialen (max. 3 Zeichen, z. B. SS)", name: initials, widget: string }
              - { label: "Rolle (z. B. Trainerin)", name: role, widget: string, default: "Trainer" }
              - { label: "Name", name: name, widget: string }
              - { label: "E-Mail (optional)", name: email, widget: string, required: false }
              - { label: "Telefon (optional)", name: phone, widget: string, required: false }

  # ── Board / Vorstand ──────────────────────────────────────────
  - name: board
    label: "Vorstand"
    icon: groups
    files:
      - name: board
        label: "Vorstandsmitglieder"
        file: "content/board.json"
        description: "Die Ansprechpartner auf der Seite „Vorstand“."
        fields:
          - label: "Mitglieder"
            name: items
            label_singular: "Mitglied"
            widget: list
            summary: "{{fields.role}} – {{fields.name}}"
            fields:
              - { label: "Initialen (oder — bei vakant)", name: initials, widget: string }
              - { label: "Rolle / Amt", name: role, widget: string }
              - { label: "Name", name: name, widget: string }
              - { label: "E-Mail (optional)", name: email, widget: string, required: false }
              - { label: "Position derzeit vakant?", name: vacant, widget: boolean, default: false }
