        file: "content/news.json"
        description: "Die Meldungen im Bereich „Neuigkeiten aus dem Verein“."
        fields:
          - label: "Meldungen"
            name: items
            label_singular: "Meldung"
            widget: list
            summary: "{{fields.title}}"
            hint: "Neueste Meldung erscheint automatisch oben. Mit „+“ neue Meldung hinzufügen."
            fields:
              - { label: "Datum", name: date, widget: datetime, date_format: "DD.MM.YYYY", time_format: false, format: "YYYY-MM-DD", picker_utc: true, hint: "Tag und Monat erscheinen automatisch auf der Website." }
